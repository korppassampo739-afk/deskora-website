
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deskora Demo</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #090910;
      color: white;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }
    main {
      width: min(900px, 92%);
      padding: 35px;
      background: #151522;
      border: 1px solid #33334a;
      border-radius: 22px;
    }
    h1 { font-size: 38px; margin-bottom: 8px; }
    p { color: #aaaabd; }
    .preview {
      margin-top: 28px;
      padding: 24px;
      min-height: 300px;
      border-radius: 16px;
      background: linear-gradient(135deg,#29204b,#111827);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .clock { font-size: 52px; font-weight: bold; }
    .dock {
      display: flex;
      gap: 12px;
      justify-content: center;
      padding: 14px;
      background: #ffffff18;
      border-radius: 15px;
    }
    .dock span { font-size: 25px; }
    button {
      background: #9b75ff;
      color: white;
      border: 0;
      border-radius: 10px;
      padding: 12px 18px;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <main>
    <h1>Deskora Preview</h1>
    <p>Explore a small preview of your future Windows desktop.</p>
    <div class="preview">
      <div>
        <div class="clock" id="clock">00:00</div>
        <p>Your desktop, your style.</p>
      </div>
      <div class="dock">
        <span>🌐</span><span>📁</span><span>🎮</span><span>⚙️</span>
      </div>
    </div>
    <p>Interactive browser preview — not the full Windows app.</p>
  </main>
  <script>
    function updateClock() {
      document.getElementById("clock").textContent =
        new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
    }
    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
